<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>骑行仪表盘 · 播放器外挂</title>
<style>
  :root{
    --accent:#3de0c9; --bg:#0c1014; --panel:rgba(12,16,20,.66); --line:rgba(255,255,255,.14);
    --text:#eef2f5; --dim:#9aa7b0; --warn:#ffb65c; --hr:#ff6b6b; --alt:#7fb8ff; --slope:#b8e06b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
  /* ===== 顶栏 ===== */
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0}
  .brand{font-weight:700;letter-spacing:.5px;font-size:15px;white-space:nowrap}
  .brand small{color:var(--dim);font-weight:400;margin-left:6px;font-size:11px}
  .spacer{flex:1}
  .btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.primary{background:rgba(61,224,201,.16);border-color:rgba(61,224,201,.5);color:var(--accent)}
  .btn.primary:hover{background:rgba(61,224,201,.26)}
  select.btn{padding:5px 8px;background:rgba(255,255,255,.07)}
  .status{font-size:12px;color:var(--dim);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
  .offset-badge{font-size:12px;color:var(--accent);white-space:nowrap;padding:3px 10px;background:rgba(61,224,201,.08);border-radius:6px;border:1px solid rgba(61,224,201,.2);font-variant-numeric:tabular-nums}
  /* ===== 舞台 ===== */
  .stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0;position:relative}
  .stage{position:relative;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:100%;max-height:100%}
  .stage video,.stage canvas{display:block;width:100%;height:100%;object-fit:contain}
  .stage canvas{position:absolute;inset:0}
  .stage.layout-edit canvas{cursor:grab}
  .stage.layout-edit canvas:active{cursor:grabbing}
  .stage.layout-edit canvas{touch-action:none}
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim);z-index:5;background:radial-gradient(120% 120% at 50% 30%,#10161c 0%,#080b0e 100%);text-align:center;padding:20px}
  .empty.dimmed{pointer-events:none;opacity:0}
  .empty .big{font-size:16px;color:var(--text)}
  .empty .hint{font-size:12px;line-height:1.9;max-width:420px}
  .empty .hint b{color:var(--accent);font-weight:600}
  .empty .row{display:flex;gap:10px}
  .badge{display:inline-block;border:1px dashed var(--line);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--dim)}
  /* ===== 控制条 ===== */
  .controlbar{display:flex;align-items:center;gap:12px;padding:8px 16px 12px;border-top:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
  .ctrl-btn{background:none;border:none;color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .ctrl-btn:hover{background:rgba(255,255,255,.12)}
  .ctrl-btn svg{width:18px;height:18px;fill:currentColor}
  input[type=range].seek{flex:1;min-width:140px;accent-color:var(--accent);cursor:pointer}
  .time{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .speed-select{margin-left:auto}
  .widgets-toggle{display:flex;gap:6px;align-items:center}
  .widgets-toggle label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:4px 9px;border-radius:20px;transition:all .15s}
  .widgets-toggle label.on{background:rgba(61,224,201,.14);border-color:rgba(61,224,201,.5);color:var(--accent)}
  .widgets-toggle label input{display:none}
  /* ===== 仪表开关面板 ===== */
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(300px,86vw);background:#11161c;border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
  .panel.open{transform:translateX(0)}
  .panel .p-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
  .panel .p-head h3{font-size:14px}
  .panel .p-close{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:4px 8px}
  .panel .p-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
  .panel .p-body h4{font-size:11px;color:var(--dim);letter-spacing:1px;margin-top:6px}
  .panel label{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .panel label span:first-child{display:flex;align-items:center;gap:8px}
  .panel label .dot{width:8px;height:8px;border-radius:50%}
  .panel input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
  .panel .note{font-size:11px;color:var(--dim);line-height:1.7;margin-top:10px}
  .panel .note code{color:var(--accent);font-size:11px}
  .panel .p-sep{border:none;border-top:1px solid var(--line);margin:8px 0}
  .offset-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .offset-val{font-size:15px;font-weight:600;color:var(--accent);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
  .offset-val-wide{min-width:100%;font-size:12px;order:-1;width:100%;text-align:left;margin-bottom:4px;line-height:1.5}
  .off-btn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg);font-size:11px;padding:5px 8px;border-radius:6px;cursor:pointer;font-family:inherit}
  .off-btn:hover{background:rgba(255,255,255,.12)}
  .off-input{flex:1;min-width:80px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--fg);font-size:12px;padding:5px 8px;border-radius:6px;font-family:inherit}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39;opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.show{opacity:1;pointer-events:auto}
  .widget-menu{position:fixed;z-index:60;display:none;min-width:132px;padding:5px;background:#11161c;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .widget-menu.open{display:block}
  .widget-menu button{display:block;width:100%;border:0;background:none;color:var(--text);text-align:left;border-radius:5px;padding:8px 10px;font-size:13px;font-family:inherit;cursor:pointer}
  .widget-menu button:hover{background:rgba(255,255,255,.12)}
  @media (max-width:720px){
    .topbar{padding:8px 10px;gap:8px}
    .brand small{display:none}
    .status{max-width:150px}
    .stage-wrap{padding:8px}
    .controlbar{padding:6px 10px 10px;gap:8px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">骑行仪表盘 <small>player overlay · 外挂显示</small></div>
  <div class="spacer"></div>
  <div class="status" id="status">未加载数据</div>
  <div class="offset-badge" id="offsetBadge" style="display:none"></div>
  <button class="btn" id="btnVideo">打开视频</button>
  <button class="btn primary" id="btnData">打开数据 JSON</button>
  <button class="btn" id="btnPanel">仪表盘</button>
  <input type="file" id="fileVideo" accept="video/mp4,video/quicktime,video/webm,video/x-matroska,video/*" hidden>
  <input type="file" id="fileData" accept=".json,application/json" hidden>
</div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="empty" id="empty">
      <div class="big">把视频和运动数据「外挂」到播放器里</div>
      <div class="row">
        <button class="btn primary" id="btnData2">选择数据 JSON</button>
        <button class="btn" id="btnVideo2">选择视频</button>
      </div>
      <div class="hint">
        直接 <b>拖拽</b> 文件到窗口即可：<span class="badge">.mp4 / .mov</span> <span class="badge">.json</span><br>
        JSON 由 <b>bin/gopro-export-json.py</b> 从 FIT / GPX / GoPro 元数据导出<br>
        先拖数据可「无视频预览」仪表盘动画；再拖视频即叠加到画面上
      </div>
    </div>
  </div>
</div>

<div class="controlbar">
  <button class="ctrl-btn" id="btnPlay" title="播放 / 暂停 (空格)">
    <svg id="icPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <span class="time" id="timeCur">00:00</span>
  <input type="range" class="seek" id="seek" min="0" max="1000" value="0" step="1">
  <span class="time" id="timeTot">00:00</span>
  <select class="btn speed-select" id="rate" title="播放速度">
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="3">3×</option>
    <option value="4">4×</option>
  </select>
</div>

<div class="scrim" id="scrim"></div>
<div class="panel" id="panel">
  <div class="p-head"><h3>仪表盘开关</h3><button class="p-close" id="btnPanelClose">×</button></div>
  <div class="p-body" id="panelBody"></div>
</div>
<div class="widget-menu" id="widgetMenu"><button id="deleteWidgetBtn">删除仪表</button></div>

<script>
/* ============================================================================
 * 骑行仪表盘 · 播放器外挂
 * 数据：bin/gopro-export-json.py 导出的列式 JSON（{meta, series}）
 * 时间轴：t = 相对视频开头的秒；播放器用 video.currentTime 查表插值。
 * 改仪表样式/开关 = 改这个文件，刷新即生效；视频原片永不重新渲染。
 * ==========================================================================*/

const CONFIG = {
  speedUnit: 'kph',      // 'kph' | 'mph'
  distanceUnit: 'km',    // 'km' | 'mi'
  historyWindow: 600,    // 底部功率曲线时间窗（秒）
  historyStep: 0.25,     // 曲线采样步长（秒）
  ftp: 195,              // 功能阈值功率（W），用于功率区间着色
  speedGaugeMax: 60,     // 速度仪表盘量程（U.spd 单位，如 km/h）
  profileStep: 1.0,      // 海拔剖面采样步长（秒）
  powerFaceAverageWindow: 10, // 功率表情区间使用最近 N 秒平均功率
  trackWindowKm: 1, // 左侧区间轨迹数据范围：当前位置前后各 N 公里
  trackZoomKm: 0.5, // 左侧区间轨迹显示比例：视图中心前后各 N 公里
  palette: { accent:'#3de0c9', warn:'#ffb65c', hr:'#ff6b6b', alt:'#7fb8ff', slope:'#b8e06b', text:'#f4f7f9', dim:'#9aa7b0' },
};

/*
 * 仪表注册表：新增/删除仪表只需要修改这里的一项。
 *
 * - draw：对应的绘制函数
 * - x/y/w/h：默认位置和拖动命中区域（设计坐标 1280×720）
 * - baseX/baseY：绘制函数内部的固定基准坐标
 *
 * 面板开关、布局保存、拖动命中和实际绘制都会从这个列表自动生成。
 * 例如新增一个已经实现了 drawMyWidget(p) 的仪表：
 * { key:'mywidget', label:'我的仪表', color:'#fff', def:true,
 *   draw:drawMyWidget, x:500, y:100, w:180, h:80, baseX:500, baseY:100 },
 */
const WIDGETS = [
  { key:'speedgauge', label:'速度仪表', color:'#3de0c9', def:true, draw:drawSpeedGauge, x:30.6283309958, y:377.4003331, w:150, h:177, baseX:36, baseY:250 },
  { key:'power',      label:'功率',     color:'#ffb65c', def:true, draw:drawPower,      x:34.5562762973, y:324.473439691, w:116, h:78,  baseX:36,  baseY:146 },
  { key:'hr',         label:'心率',     color:'#ff6b6b', def:true, draw:drawHr,         x:182.9261044881, y:322.244740533, w:116, h:78,  baseX:162, baseY:146 },
  { key:'cad',        label:'踏频',     color:'#3de0c9', def:true, draw:drawCad,        x:186.1583099579, y:409.025946704, w:116, h:78,  baseX:288, baseY:146 },
  { key:'grad',       label:'坡度',     color:'#b8e06b', def:true, draw:drawGrad,       x:184.2761220196, y:494.646037868, w:116, h:54,  baseX:36,  baseY:440 },
  { key:'dist',       label:'距离',     color:'#f4f7f9', def:true, draw:drawDist,       x:31.0560133240, y:256.126840813, w:116, h:54,  baseX:162, baseY:440 },
  { key:'atemp',      label:'温度',     color:'#d8dee3', def:false,draw:drawAtemp,      x:994, y:246, w:250, h:54, baseX:994, baseY:30 },
  { key:'curve',      label:'速度曲线', color:'#3de0c9', def:true, draw:drawCurve,      x:0, y:584.7681451612904, w:1280, h:70, baseX:0, baseY:560 },
  { key:'profile',    label:'海拔剖面', color:'#7fb8ff', def:true, draw:drawProfile,    x:0, y:655, w:1280, h:65, baseX:0, baseY:640 },
  { key:'mapWindow',  label:'近2公里轨迹', color:'#7fb8ff', def:true, draw:drawMapWindow, x:994, y:335.2783134642356, w:250, h:250, baseX:994, baseY:250 },
  { key:'map',        label:'轨迹地图', color:'#3de0c9', def:true, draw:drawMap,        x:36,  y:284.7519284712483, w:250, h:300, baseX:994, baseY:250 },
];

/* 以下布局索引由 WIDGETS 自动生成，避免新增仪表时漏改其它结构。 */
const LAYOUT_DEFAULTS = Object.fromEntries(WIDGETS.map(w => [w.key, {x:w.x, y:w.y, w:w.w, h:w.h}]));
const LAYOUT_BASES = Object.fromEntries(WIDGETS.map(w => [w.key, {x:w.baseX, y:w.baseY}]));
const LAYOUT_KEYS = WIDGETS.map(w => w.key);

/* ---------------- 状态 ---------------- */
const S = {
  data:null, series:null, fields:[], profile:null, track:null,
  videoSrc:null, videoReady:false,
  playing:false, rate:1, virtualT:0, lastTs:null, hasVideo:false,
  dataStart:0, dataDuration:0,
  widgets:{}, history:[], dirty:true,
  offset:0, offsetKey:null, offsetSegments:null,
  layout:{}, layoutEdit:false, draggingLayout:null,
  removedWidgets:new Set(), contextWidget:null,
  cadencePhase:0, cadenceT:null,
  heartPhase:0, heartT:null,
  powerFaceZone:null, powerFaceAnimating:false, powerFaceUpdateFrame:-1,
  powerBreathPhase:0, powerBreathT:null,
  powerFaceSamples:[], powerFaceSampleT:null,
};
function loadRemovedWidgetPrefs(){
  try{
    const saved = JSON.parse(localStorage.getItem('dashboard-removed-widgets') || '[]');
    if(Array.isArray(saved)) saved.forEach(key=>S.removedWidgets.add(key));
  }catch(e){}
}
function saveRemovedWidgetPrefs(){
  try{ localStorage.setItem('dashboard-removed-widgets', JSON.stringify([...S.removedWidgets])); }catch(e){}
}
function widgetAvailable(key){ return !S.removedWidgets.has(key); }
loadRemovedWidgetPrefs();
function loadWidgetPrefs(){
  const prefs = {};
  try{
    WIDGETS.forEach(w => prefs[w.key] = localStorage.getItem('w_'+w.key));
  }catch(e){}
  WIDGETS.forEach(w => S.widgets[w.key] = prefs[w.key]==null ? w.def : prefs[w.key]==='1');
}
loadWidgetPrefs();
function mergeLayoutConfig(config){
  const widgets = config && config.widgets ? config.widgets : {};
  Object.keys(widgets).forEach(key=>{
    if(!LAYOUT_DEFAULTS[key]) return;
    const source = widgets[key];
    ['x','y','w','h'].forEach(field=>{
      if(Number.isFinite(source[field])) LAYOUT_DEFAULTS[key][field] = source[field];
    });
  });
}
function loadLayoutPrefs(){
  LAYOUT_KEYS.forEach(key=>{
    const d = LAYOUT_DEFAULTS[key];
    S.layout[key] = {
      x: d.x,
      y: d.y,
      w: d.w, h: d.h,
    };
  });
}
loadLayoutPrefs();
fetch(new URL('layout-config.json', document.baseURI))
  .then(response=>response.ok ? response.json() : {})
  .then(config=>{ mergeLayoutConfig(config); loadLayoutPrefs(); S.dirty = true; })
  .catch(()=>{});

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas'), stage = $('stage');
const ctx = canvas.getContext('2d');
const empty = $('empty');

/* ---------------- 单位换算 ---------------- */
const UNITS = {
  kph: { spd:v=>v*3.6,      spdL:'km/h',  dist:v=>v/1000,     distL:'km' },
  mph: { spd:v=>v*2.236936, spdL:'mph',   dist:v=>v/1609.344, distL:'mi' },
};
const U = UNITS[CONFIG.speedUnit] || UNITS.kph;

/* ---------------- 数据加载 ---------------- */
function setStatus(msg){ $('status').textContent = msg; }

async function loadDataFromFile(file){
  setStatus('读取 ' + file.name + ' …');
  try{
    const text = await file.text();
    parseData(text, file.name);
    tryAutoLoadOffset(file.name);
  }catch(e){ setStatus('数据读取失败: ' + e.message); }
}
async function loadDataFromUrl(url){
  setStatus('加载 ' + url + ' …');
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    parseData(await r.text(), url);
    tryAutoLoadOffset(url);
  }catch(e){
    setStatus('无法从 ' + url + ' 加载（file:// 下禁止 fetch，请直接拖拽 JSON 文件）');
  }
}
/* 自动查找与数据同名的 .offset.json 并应用（URL 未显式指定 offsetFile 时） */
function tryAutoLoadOffset(dataUrl){
  const q = new URLSearchParams(location.search);
  if(q.get('offsetFile') !== null) return; // 显式指定了 offsetFile，由那边加载
  try{
    const u = new URL(dataUrl, location.href);
    const offsetUrl = u.href.replace(/\.json$/i, '.offset.json');
    if(offsetUrl === u.href) return;
    fetch(offsetUrl).then(r=>{ if(!r.ok) return null; return r.json(); }).then(j=>{
      if(j) applyOffsetFile(j);
    }).catch(()=>{});
  }catch(e){}
}
/* 解析 offset 文件：segments 里每段视频有独立的 offset（视频间有暂停/间隔时非线性） */
function applyOffsetFile(j){
  if(j.segments && Array.isArray(j.segments) && j.segments.length){
    const dataStart = new Date(j.data_start_utc).getTime() / 1000;
    S.offsetSegments = j.segments.map(seg => ({
      video_start_s: seg.video_start_s,
      duration_s: seg.duration_s,
      offset_s: (new Date(seg.start_utc).getTime() / 1000 - dataStart) - seg.video_start_s,
      video: seg.video,
    }));
  } else if(typeof j.offset_s === 'number'){
    // 兼容旧格式：单一全局 offset
    S.offsetSegments = null;
    S.offset = j.offset_s;
  }
  S.dirty = true;
  const ov = $('offsetVal'); if(ov) ov.textContent = fmtOffsetDisplay();
}
/* 视频时间 → 数据时间：根据当前视频时间找对应 segment，用该段的 offset + 用户微调 */
function videoTimeToDataTime(vt){
  if(S.offsetSegments && S.offsetSegments.length){
    let seg = S.offsetSegments[0];
    for(let i = 0; i < S.offsetSegments.length; i++){
      const s = S.offsetSegments[i];
      if(vt >= s.video_start_s && vt < s.video_start_s + s.duration_s){ seg = s; break; }
      if(vt >= s.video_start_s) seg = s; // 超出最后一段时用最后一段
    }
    return vt + seg.offset_s + S.offset;
  }
  return vt + S.offset;
}
/* 数据时间 → 视频时间：用于点击功率条反向寻时。 */
function dataTimeToVideoTime(dt){
  if(!S.hasVideo) return dt - S.dataStart;
  if(S.offsetSegments && S.offsetSegments.length){
    let seg = S.offsetSegments[0];
    for(let i=0;i<S.offsetSegments.length;i++){
      const s=S.offsetSegments[i];
      const start=s.video_start_s+s.offset_s+S.offset;
      const end=start+s.duration_s;
      if(dt>=start && dt<=end){ seg=s; break; }
      if(dt>=start) seg=s;
    }
    return dt-seg.offset_s-S.offset;
  }
  return dt-S.offset;
}
/* 当前 segment 的基础 offset（不含用户微调），用于 UI 显示 */
function currentBaseOffset(vt){
  if(S.offsetSegments && S.offsetSegments.length){
    let seg = S.offsetSegments[0];
    for(let i = 0; i < S.offsetSegments.length; i++){
      const s = S.offsetSegments[i];
      if(vt >= s.video_start_s && vt < s.video_start_s + s.duration_s){ seg = s; break; }
      if(vt >= s.video_start_s) seg = s;
    }
    return seg.offset_s;
  }
  return 0;
}
function fmtOffsetDisplay(){
  const vt = currentT();
  const base = currentBaseOffset(vt);
  const total = videoTimeToDataTime(vt) - vt;
  if(S.offsetSegments && S.offsetSegments.length){
    return '基础 ' + base.toFixed(1) + '  微调 ' + (S.offset >= 0 ? '+' : '') + S.offset.toFixed(1) + '  = ' + (total >= 0 ? '+' : '') + total.toFixed(1) + 's';
  }
  return (S.offset >= 0 ? '+' : '') + S.offset.toFixed(1) + 's';
}
/* 顶部 offset 标签文字 */
function offsetBadgeText(){
  if(!S.series) return '';
  const vt = currentT();
  if(S.offsetSegments && S.offsetSegments.length){
    const total = videoTimeToDataTime(vt) - vt;
    return '⏱ 分段 ' + (total >= 0 ? '+' : '') + total.toFixed(1) + 's';
  }
  if(Math.abs(S.offset) > 0.01){
    return '⏱ ' + (S.offset >= 0 ? '+' : '') + S.offset.toFixed(1) + 's';
  }
  return '';
}
function parseData(text, name){
  const d = JSON.parse(text);
  let series;
  if(d.rows && Array.isArray(d.rows) && d.fields){
    // 行式（v2）→ 列式（运行时列式便于二分查找）
    series = {};
    d.fields.forEach((f, ci) => { series[f] = d.rows.map(r => r[ci]); });
  } else if(d.series && Array.isArray(d.series.t)){
    series = d.series; // 兼容旧列式（v1）
  } else {
    throw new Error('不是 gopro-export-json 输出格式');
  }
  S.data = d; S.series = series;
  S.fields = (d.fields || (d.meta && d.meta.fields) || []).filter(f => f!=='t' && Array.isArray(series[f]));
  S.dataStart = Number(series.t[0]) || 0;
  const dataEnd = Number(series.t[series.t.length-1]);
  S.dataDuration = Math.max(0, Number(d.meta && d.meta.duration_s) || dataEnd - S.dataStart || 0);
  // offset 持久化：按数据文件名；URL 显式指定 offset 时不覆盖
  S.offsetKey = name.replace(/^.*\//,'').replace(/\.json$/,'');
  if(new URLSearchParams(location.search).get('offset') === null){
    try{ const saved = localStorage.getItem('off_'+S.offsetKey); if(saved !== null) S.offset = parseFloat(saved) || 0; }catch(e){}
  }
  const ov = $('offsetVal'); if(ov) ov.textContent = fmtOffsetDisplay();
  buildProfile();
  buildTrack();
  const n = series.t.length;
  const span = S.dataDuration;
  empty.classList.add('dimmed'); // 数据已加载：隐藏引导，直接预览仪表盘
  S.statusBase = name + ' · ' + n.toLocaleString() + ' 点 · ' + fmtDur(span) + (d.meta && d.meta.alignment==='data-only' ? ' · 纯数据模式' : '');
  setStatus(S.statusBase);
  resetTransport();
  prefillHistory();
  draw();
}
/* 重建功率曲线窗口：以数据时间 dataT 为中心，前后各取一半窗口；
   在数据起点/终点附近自动贴边，避免出现空白区域 */
function rebuildHistoryTo(dataT){
  S.history = [];
  if(!S.series || S.series.power==null || !S.series.t || !S.series.t.length) return;
  const step = CONFIG.historyStep, win = CONFIG.historyWindow;
  const ts = S.series.t;
  const dataStart = S.dataStart||0, dataEnd = ts[ts.length-1];
  let tStart = Math.max(dataStart, dataT - win / 2);
  let tEnd = Math.min(dataEnd, dataT + win / 2);
  if(tEnd - tStart < win){
    if(tStart <= dataStart) tEnd = Math.min(dataEnd, dataStart + win);
    else if(tEnd >= dataEnd) tStart = Math.max(dataStart, dataEnd - win);
  }
  const keep = Math.ceil(win/step);
  for(let tt = tStart; tt <= tEnd; tt += step){
    const p = sampleAt(tt);
    if(!p) continue;
    S.history.push({t: tt, v: p.power!=null?p.power:0});
    if(S.history.length>keep) S.history.splice(0, S.history.length-keep);
  }
  // 这里记录的是窗口中心，而不是历史数组的末尾时间。
  lastHistT = dataT;
}
/* 数据加载后预填充历史曲线窗口：暂停状态也能看到最近一段曲线 */
function prefillHistory(){
  rebuildHistoryTo((S.dataStart||0) + CONFIG.historyWindow / 2);
}
function buildProfile(){
  const ts = S.series.t, al = S.series.alt;
  if(!ts || !al){ S.profile = null; return; }
  const step = Math.max(1, Math.round(CONFIG.profileStep/avgStep()));
  const points = [];
  let amin=Infinity, amax=-Infinity;
  for(let i=0;i<ts.length;i+=step){
    points.push([ts[i], al[i]]);
    if(al[i]!=null){ if(al[i]<amin)amin=al[i]; if(al[i]>amax)amax=al[i]; }
  }
  if(!isFinite(amin)){ amin=0; amax=1; }
  if(amax-amin<2){ amin-=1; amax+=1; }
  S.profile = {points, amin, amax, t0:points[0][0], t1:points[points.length-1][0]};
}
function buildTrack(){
  const lat = S.series.lat, lon = S.series.lon, ts = S.series.t, odo = S.series.odo;
  if(!lat || !lon){ S.track = null; return; }
  let minLat=Infinity, maxLat=-Infinity, minLon=Infinity, maxLon=-Infinity;
  const raw = [];
  let cumulative=0, previous=null;
  for(let i=0;i<lat.length;i++){
    if(lat[i]==null||lon[i]==null) continue;
    if(previous){
      const dLat=(lat[i]-previous[0])*Math.PI/180;
      const dLon=(lon[i]-previous[1])*Math.PI/180;
      const meanLat=((lat[i]+previous[0])/2)*Math.PI/180;
      cumulative += 6371000*Math.sqrt(dLat*dLat + Math.pow(dLon*Math.cos(meanLat),2));
    }
    raw.push([lat[i], lon[i], ts[i], odo&&odo[i]!=null?Number(odo[i]):null, cumulative]);
    previous=[lat[i],lon[i]];
    if(lat[i]<minLat)minLat=lat[i]; if(lat[i]>maxLat)maxLat=lat[i];
    if(lon[i]<minLon)minLon=lon[i]; if(lon[i]>maxLon)maxLon=lon[i];
  }
  if(raw.length<2){ S.track=null; return; }
  // 降采样到最多 2000 点，保证绘制流畅
  const step = Math.max(1, Math.floor(raw.length/2000));
  const pts = [];
  for(let i=0;i<raw.length;i+=step) pts.push(raw[i]);
  if(pts[pts.length-1]!==raw[raw.length-1]) pts.push(raw[raw.length-1]);
  const centerLat = (minLat+maxLat)/2;
  S.track = {pts, minLat, maxLat, minLon, maxLon, hasOdo:pts.some(pt=>Number.isFinite(pt[3])),
    latScale:111320, lonScale:111320*Math.cos(centerLat*Math.PI/180)};
}
function avgStep(){
  const ts = S.series.t;
  const span = Math.min(ts.length-1, 2000);
  return span>0 ? (ts[span]-ts[0])/span : 0.1;
}
function sampleAt(t){
  const ts = S.series.t;
  if(!ts.length) return null;
  if(t < ts[0]) return null;
  const last = ts.length-1;
  if(t >= ts[last]) return pointAt(last, 1, t);
  let lo=0, hi=last;
  while(lo<hi){ const mid=(lo+hi+1)>>1; if(ts[mid]<=t) lo=mid; else hi=mid-1; }
  const i=lo, i1=Math.min(i+1,last), span=ts[i1]-ts[i];
  const frac = span>0 ? (t-ts[i])/span : 0;
  return pointAt(i, frac, t);
}
function pointAt(i, frac, t){
  const out = { t };
  for(const f of S.fields){
    const arr = S.series[f];
    if(!arr){ out[f] = null; continue; }
    const i1 = Math.min(i+1, arr.length-1);
    const a = arr[i], b = arr[i1];
    out[f] = (a==null||b==null) ? (a!=null?a:b) : a + (b-a)*frac;
  }
  return out;
}

/* ---------------- 传输控制 ---------------- */
function resetTransport(){ S.virtualT = 0; S.lastTs = null; S.playing = false; S.history = []; lastHistT = null; updatePlayIcon(); S.dirty = true; }
function duration(){
  if(S.hasVideo && video.readyState) return video.duration || 0;
  if(S.data) return S.dataDuration;
  return 0;
}
function currentT(){
  if(S.hasVideo && video.readyState>=1) return video.currentTime;
  return S.virtualT;
}
function seekTo(t){
  t = Math.max(0, Math.min(t, duration() || t));
  if(S.hasVideo && video.readyState>=1){ video.currentTime = t; }
  S.virtualT = t;
  rebuildHistoryTo(playbackDataTime(t));
  S.dirty = true;
}
function playbackDataTime(t){
  // In data-only mode the virtual clock is relative to the first data point.
  // Video offsets are meaningful only after a video has been loaded.

}
function togglePlay(){
  if(!S.data && !S.hasVideo) return;
  if(S.hasVideo && video.readyState>=1){
    if(video.paused) video.play(); else video.pause();
    S.playing = !video.paused;
  }else{
    S.playing = !S.playing;
    if(S.playing && S.virtualT >= (duration()||0)) S.virtualT = 0;
  }
  updatePlayIcon();
  S.dirty = true;
}
function updatePlayIcon(){
  $('icPlay').style.display = S.playing ? 'none':'block';
  $('icPause').style.display = S.playing ? 'block':'none';
}
video.addEventListener('play', ()=> { S.playing=true; updatePlayIcon(); });
video.addEventListener('pause', ()=> { S.playing=false; updatePlayIcon(); });
video.addEventListener('seeked', ()=>{ S.dirty = true; });

/* ---------------- 视频 ---------------- */
function loadVideoFile(file){
  const url = URL.createObjectURL(file);
  if(S.videoSrc) URL.revokeObjectURL(S.videoSrc);
  S.videoSrc = url;
  video.src = url;
  video.load();

video.addEventListener('loadedmetadata', ()=>{
  S.hasVideo = true;

  setStatus((S.data? '数据已加载 · ':'') + '视频 ' + fmtDur(video.duration||0) + ' · 空格播放');

video.addEventListener('error', ()=>{
  if(!S.data) empty.classList.remove('dimmed');
  setStatus('视频加载失败，请换一个文件');

function fitStage(ar){
  const wrap = stage.parentElement;
  const availW = wrap.clientWidth - 28, availH = wrap.clientHeight - 28;
  let w = availW, h = w / ar;
  if(h > availH){ h = availH; w = h * ar; }
  stage.style.width = w+'px'; stage.style.height = h+'px';
  sizeCanvas();
}
function sizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(stage.clientWidth * dpr);
  canvas.height = Math.round(stage.clientHeight * dpr);
}
window.addEventListener('resize', ()=>{
  if(S.hasVideo) fitStage(video.videoWidth/video.videoHeight);
  else fitStage(16/9);
  draw();
});

/* ---------------- 绘制：仪表盘 ---------------- */
const LAYOUT_W = 1280, LAYOUT_H = 720; // 设计基准，坐标按此缩放；非 16:9 视频时仪表垂直居中
function drawWidgetAt(key, fn){
  const p = S.layout[key], d = LAYOUT_BASES[key];
  ctx.save();
  ctx.translate(p.x - d.x, p.y - d.y);
  fn();
  ctx.restore();
}
function draw(){
  if(!stage.clientWidth) return;
  const dpr = window.devicePixelRatio || 1;
  if(Math.abs(canvas.width - stage.clientWidth*dpr) > 2) sizeCanvas();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!S.data) return;
  const s = Math.min(stage.clientWidth/LAYOUT_W, stage.clientHeight/LAYOUT_H);
  const ox = (stage.clientWidth - LAYOUT_W*s)/2, oy = (stage.clientHeight - LAYOUT_H*s)/2;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(s,s);
  S.drawFrame=(S.drawFrame||0)+1;
  S.powerFaceAnimating=false;
  S.metricAnimating=false;

  const p = sampleAt(playbackDataTime(currentT()));
  if(p){ pushHistory(p); }
  if(S.playing && p && p.hr!=null){ updateHeartPhase(p); S.metricAnimating=true; }
  if(S.playing && p && p.cad!=null){ updateCadencePhase(p); S.metricAnimating=true; }
  // 惰性更新面板 offset 显示（seek/播放导致 segment 变化时）
  const ov = $('offsetVal');
  if(ov){ const txt = fmtOffsetDisplay(); if(ov.textContent !== txt) ov.textContent = txt; }
  // 惰性更新顶部 offset 标签（独立元素，不被状态栏截断）
  const ob = $('offsetBadge');
  if(ob){
    const txt = offsetBadgeText();
    if(txt){
      if(ob.style.display !== 'inline-block') ob.style.display = 'inline-block';
      if(ob.textContent !== txt) ob.textContent = txt;
    } else if(ob.style.display !== 'none'){
      ob.style.display = 'none';
    }
  }

  // WIDGETS 是唯一的仪表注册表；删除/新增配置项会自动影响这里。
  WIDGETS.forEach(w=>{
    if(widgetAvailable(w.key) && S.widgets[w.key] && typeof w.draw === 'function'){
      drawWidgetAt(w.key, ()=>w.draw(p));
    }
  });

  ctx.restore();
  S.dirty = S.powerFaceAnimating || S.metricAnimating;
}
function panel(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  ctx.fillStyle = 'rgba(10,14,18,.68)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.lineWidth = 1;
  ctx.stroke();
}
function label(x,y,text,color){

}
function bigNum(x,y,text,color,size){

function fmtNum(v,d){

}
function drawSpeed(p){

/* 速度表盘（参考原渲染器 CairoGaugeRoundAnnotated：254° 弧形刻度 + 指针） */
function drawSpeedGauge(p){
  // 紧凑版速度仪表：约为原尺寸的三分之一，释放左侧中部空间。
  // 旋转中心位于底部，刻度弧线布置在中心上方。
  const cx=111, cy=355, r=63;
  const vMax = CONFIG.speedGaugeMax || 60;
  panel(cx-r-9, cy-r-9, (r+9)*2, (r+9)*2, 14);
  // 从左侧开始沿上方半圆顺时针旋转：0 在 180°，最大值在 360°（0°）。
  const a0 = Math.PI, a1 = Math.PI * 2;
  // 紧凑刻度：减少刻度数量，避免文字挤占空间。
  const sectors = 8;
  for(let i=0;i<=sectors;i++){
    const ang = a0 + (a1-a0)*i/sectors;
    const major = i%2===0;
    const r1 = r-(major?10:6), r2 = r-17;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(ang)*r1, cy+Math.sin(ang)*r1);
    ctx.lineTo(cx+Math.cos(ang)*r2, cy+Math.sin(ang)*r2);
    ctx.strokeStyle = major ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.22)';
    ctx.lineWidth = major?1.5:1;
    ctx.stroke();
    if(major){
      ctx.font='700 12px Menlo,Consolas,monospace';
      ctx.fillStyle='rgba(255,255,255,.65)';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const tr = r-27;
      ctx.fillText(String(Math.round(vMax*i/sectors)), cx+Math.cos(ang)*tr, cy+Math.sin(ang)*tr);
    }
  }
  // 指针
  const spd = p && p.speed!=null ? p.speed : 0;
  const frac = Math.max(0, Math.min(1, U.spd(spd)/vMax));
  const ang = a0 + (a1-a0)*frac;
  ctx.beginPath();
  ctx.moveTo(cx+Math.cos(ang)*(r-12), cy+Math.sin(ang)*(r-12));
  ctx.lineTo(cx-Math.cos(ang)*10, cy-Math.sin(ang)*10);
  ctx.strokeStyle = CONFIG.palette.accent;
  ctx.lineWidth=3.75; ctx.lineCap='round';
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI*2); ctx.fillStyle=CONFIG.palette.accent; ctx.fill();
  // 数值放在底部支点下方。
  ctx.font='600 12px -apple-system,sans-serif';
  ctx.fillStyle=CONFIG.palette.dim;
  ctx.fillText(U.spdL, cx, cy+20);
  ctx.font='700 27px Menlo,Consolas,monospace';
  ctx.fillStyle=CONFIG.palette.text;
  ctx.fillText(spd!=null?U.spd(spd).toFixed(1):'--', cx, cy+48);
  ctx.textAlign='left';
}
function tile(x,y,w,h,title,value,unit,color,vs){
  panel(x,y,w,h,12);
  label(x+14,y+22,title,'rgba(255,255,255,.5)');
  bigNum(x+14,y+50, vs!=null?vs:'--', color, 30);
  if(unit){ ctx.font='12px -apple-system,sans-serif'; ctx.fillStyle='rgba(255,255,255,.5)'; ctx.textBaseline='middle'; ctx.fillText(unit, x+14+(vs? vs.length*17+10:30), y+50); }
}
function drawPower(p){
  const instantPower=p&&p.power!=null?p.power:null;
  tile(36,146,116,78,'功率', instantPower!=null?fmtNum(instantPower,0):null,
    instantPower!=null?'W':'', CONFIG.palette.warn, instantPower!=null?fmtNum(instantPower,0):null);
  drawPowerFace(132,187,averagePowerForFace(p),p);
}
function averagePowerForFace(p){
  if(!p || p.power==null || !Number.isFinite(Number(p.t))) return null;
  const t=Number(p.t), value=Number(p.power);
  if(S.powerFaceSampleT!=null && t<S.powerFaceSampleT){
    S.powerFaceSamples=[];
    S.powerFaceSampleT=null;
  }
  if(S.powerFaceSampleT==null || t>S.powerFaceSampleT){
    S.powerFaceSamples.push({t,v:value});
    S.powerFaceSampleT=t;
  }
  const start=t-CONFIG.powerFaceAverageWindow;
  S.powerFaceSamples=S.powerFaceSamples.filter(sample=>sample.t>=start);
  if(!S.powerFaceSamples.length) return value;
  return S.powerFaceSamples.reduce((sum,sample)=>sum+sample.v,0)/S.powerFaceSamples.length;

function drawPowerFace(x,y,power,p,advance=true){
  const target=power==null ? 0 : zoneIdx(power);

  const delta=target-S.powerFaceZone;
  if(advance && S.powerFaceUpdateFrame!==S.drawFrame){
    S.powerFaceUpdateFrame=S.drawFrame;
    if(!S.playing){
      S.powerFaceZone=target;
    }else if(Math.abs(delta)>0.01){
      // 约 300ms 的区间过渡；即使暂停，也通过 S.dirty 继续绘制动画。
      S.powerFaceZone += delta*0.12;
      S.powerFaceAnimating=true;
    }else S.powerFaceZone=target;
  }

  const color=mixHexColor(ZONES[lo].color,ZONES[hi].color,mix);
  const faceLo=FACE_STYLES[lo], faceHi=FACE_STYLES[hi];
  const smile=lerp(faceLo.smile,faceHi.smile,mix);
  const open=lerp(faceLo.open,faceHi.open,mix);
  const brow=lerp(faceLo.brow,faceHi.brow,mix);
  const grin=lerp(faceLo.grin,faceHi.grin,mix);
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill();

  // 眼睛和眉毛也连续过渡，避免跨区间时突然变脸。
  ctx.strokeStyle='#10161c'; ctx.fillStyle='#10161c'; ctx.lineWidth=1.5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-7,-5+brow); ctx.lineTo(-2,-7+brow);
  ctx.moveTo(2,-7+brow); ctx.lineTo(7,-5+brow); ctx.stroke();
  if(grin>0.15){
    // 恢复区间用弯眼，避免张嘴后看起来像难受或惊讶。
    ctx.beginPath();
    ctx.arc(-4,-3,2.6,Math.PI,Math.PI*2);
    ctx.arc(4,-3,2.6,Math.PI,Math.PI*2);
    ctx.stroke();

    ctx.beginPath(); ctx.arc(-4,-3,1.4,0,Math.PI*2); ctx.arc(4,-3,1.4,0,Math.PI*2); ctx.fill();

    ctx.ellipse(0,5,3+breath*0.6,mouthOpen,0,0,Math.PI*2);

function updatePowerBreath(frequency){
  const now=performance.now()/1000;
  if(S.powerBreathT==null){
    S.powerBreathT=now;
    return S.powerBreathPhase;
  }
  const dt=Math.min(0.1,Math.max(0,now-S.powerBreathT));
  S.powerBreathPhase += dt*frequency*Math.PI*2;
  S.powerBreathPhase %= Math.PI*2;
  S.powerBreathT=now;
  return S.powerBreathPhase;
}

function updateHeartPhase(p){

const ZONES = [

function zoneIdx(w){

function drawMapWindow(p){
  if(!S.track) return;
  const x=994, y=250, w=250, hh=250;
  panel(x,y,w,hh,12);
  const radiusKm=CONFIG.trackWindowKm||1;

  // 优先使用数据中的累计里程；没有 odo 字段时，使用 GPS 点之间计算出的累计距离。
  const useOdo=S.track.hasOdo && p&&Number.isFinite(Number(p.odo));
  let currentDistance=useOdo ? Number(p.odo) : null;
  if(!Number.isFinite(currentDistance)){
    const lat=p&&p.lat!=null?Number(p.lat):null, lon=p&&p.lon!=null?Number(p.lon):null;
    let nearest=null, nearestScore=Infinity;
    S.track.pts.forEach(pt=>{
      const score=lat!=null&&lon!=null ? Math.pow(pt[0]-lat,2)+Math.pow(pt[1]-lon,2) : 0;
      if(score<nearestScore){ nearestScore=score; nearest=pt; }
    });
    currentDistance=nearest ? nearest[4] : 0;
  }
  const radius=radiusKm*1000;
  const distanceOf=pt=>useOdo ? pt[3] : pt[4];
  let pts=S.track.pts.filter(pt=>{
    const d=distanceOf(pt);
    return Number.isFinite(d) && Math.abs(d-currentDistance)<=radius;
  });
  // 追加当前插值位置，让线路在播放时立即跟随当前位置变化。
  if(p&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon))){
    pts.push([Number(p.lat),Number(p.lon),p.t,useOdo?Number(p.odo):null,currentDistance]);
    pts.sort((a,b)=>distanceOf(a)-distanceOf(b));
  }
  if(pts.length<2){
    ctx.font='11px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.textBaseline='middle';
    ctx.fillText('播放后显示区间轨迹',x+16,y+hh/2);
    return;
  }

  let minLat=Infinity,maxLat=-Infinity,minLon=Infinity,maxLon=-Infinity;
  pts.forEach(([la,lo])=>{
    minLat=Math.min(minLat,la); maxLat=Math.max(maxLat,la);
    minLon=Math.min(minLon,lo); maxLon=Math.max(maxLon,lo);
  });
  // 缩放按区间轨迹计算，但视图中心始终锁定当前播放位置。
  const currentLat=p&&p.lat!=null ? Number(p.lat) : (minLat+maxLat)/2;
  const currentLon=p&&p.lon!=null ? Number(p.lon) : (minLon+maxLon)/2;
  const centerLat=Number.isFinite(currentLat) ? currentLat : (minLat+maxLat)/2;
  const latScale=111320, lonScale=111320*Math.cos(centerLat*Math.PI/180);
  const pad=16, plotW=w-32, plotH=hh-40;
  const centerLon=Number.isFinite(currentLon) ? currentLon : (minLon+maxLon)/2;
  // 固定比例：视图范围由 trackZoomKm 决定，不随当前路线跨度自动缩放。
  // 这样路线弯曲程度变化时，仪表大小也保持稳定。
  const zoomRadius=Math.max(0.1,(CONFIG.trackZoomKm||radius)*1000);
  const scale=Math.min((plotW/2-8)/zoomRadius, (plotH/2-8)/zoomRadius);
  const px=lon=>x+pad+plotW/2+(lon-centerLon)*lonScale*scale;
  const py=lat=>y+24+plotH/2-(lat-centerLat)*latScale*scale;

  // 只在地图绘图区内绘制，超出边界的路线和标记不可见。
  ctx.save();
  ctx.beginPath(); ctx.rect(x+pad,y+24,plotW,plotH); ctx.clip();
  ctx.beginPath();
  pts.forEach(([la,lo],i)=>{ const X=px(lo),Y=py(la); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  ctx.strokeStyle='rgba(127,184,255,.7)'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
  if(p&&p.lat!=null&&p.lon!=null){
    const X=px(p.lon),Y=py(p.lat);
    ctx.beginPath(); ctx.arc(X,Y,8,0,Math.PI*2); ctx.strokeStyle=CONFIG.palette.accent; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.arc(X,Y,4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  }
  ctx.restore();
}

/* ---------------- 历史曲线数据 ---------------- */
let lastHistT = null;
function pushHistory(p){
  if(!S.series || S.series.power==null) return;
  const now = p.t;
  // 当前点移动一个采样步长后，重建以当前点为中心的窗口。
  if(lastHistT==null || Math.abs(now-lastHistT)>=CONFIG.historyStep){
    rebuildHistoryTo(now);
  }
}

/* ---------------- 主循环（虚拟时钟 + 界面） ---------------- */
function tick(){
  requestAnimationFrame(tick);
  const now = performance.now()/1000;
  let advancing = false;
  if(S.playing && !S.hasVideo && S.data){
    S.virtualT += (now-(S.lastTs||now)) * S.rate;
    const tot = duration()||0;
    if(S.virtualT>=tot && tot>0){ S.virtualT = tot; S.playing=false; updatePlayIcon(); }
    advancing = true;
  }
  if(S.hasVideo && video.readyState>=1 && !video.paused) advancing = true;
  S.lastTs = now;
  if(advancing || S.dirty){
    syncControls();
    draw();
  }
}
function syncControls(){
  const tot = duration();
  const cur = S.hasVideo&&video.readyState>=1 ? video.currentTime : S.virtualT;
  $('timeCur').textContent = fmtDur(cur);
  $('timeTot').textContent = fmtDur(tot);
  const r = $('seek');
  if(tot>0){ r.max = Math.round(tot*10); if(!r.mousedown) r.value = Math.round(cur*10); }
}
function fmtDur(s){
  if(!isFinite(s)||s==null) return '00:00';
  s=Math.max(0,Math.floor(s));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  const p=n=>String(n).padStart(2,'0');
  return h>0 ? p(h)+':'+p(m)+':'+p(ss) : p(m)+':'+p(ss);
}

/* ---------------- 仪表开关面板 ---------------- */
function buildPanel(){
  const body = $('panelBody');
  body.innerHTML = '';

  // ---- 时间偏移控制 ----
  const oh = document.createElement('h4'); oh.textContent='时间偏移'; body.appendChild(oh);
  const odesc = document.createElement('div');
  odesc.className='note';
  odesc.style.marginBottom='8px';
  odesc.textContent='分段映射：每段视频独立 offset（视频间有暂停时）；下方按钮为全局微调';
  body.appendChild(odesc);

  const orow = document.createElement('div');
  orow.className='offset-row';
  const oval = document.createElement('span');
  oval.className='offset-val offset-val-wide';
  oval.id='offsetVal';
  oval.textContent = fmtOffsetDisplay();

  function refreshOffset(){
    oval.textContent = fmtOffsetDisplay();
    S.dirty = true;
    if(S.offsetKey) try{ localStorage.setItem('off_'+S.offsetKey, S.offset); }catch(e){}
  }
  function adj(d){ S.offset = Math.round((S.offset + d)*10)/10; refreshOffset(); }

  [['-10',-10],['-1',-1],['-0.1',-0.1]].forEach(([lab,d])=>{

  });
  orow.appendChild(oval);
  [['+0.1',0.1],['+1',1],['+10',10]].forEach(([lab,d])=>{
    const b=document.createElement('button'); b.className='off-btn'; b.textContent=lab;
    b.addEventListener('click',()=>adj(d)); orow.appendChild(b);
  });
  body.appendChild(orow);

  const oirow = document.createElement('div');
  oirow.className='offset-row';
  const oinput = document.createElement('input');
  oinput.type='number'; oinput.step='0.1'; oinput.className='off-input';
  oinput.value = S.offset;
  oinput.addEventListener('change',()=>{ S.offset=parseFloat(oinput.value)||0; refreshOffset(); });
  const oreset = document.createElement('button');
  oreset.className='off-btn'; oreset.textContent='重置';
  oreset.addEventListener('click',()=>{ S.offset=0; oinput.value=0; refreshOffset(); });
  oirow.appendChild(oinput); oirow.appendChild(oreset);
  body.appendChild(oirow);

  const sep = document.createElement('hr'); sep.className='p-sep'; body.appendChild(sep);

  // ---- 仪表开关 ----
  const h = document.createElement('h4'); h.textContent='仪表'; body.appendChild(h);
  WIDGETS.filter(w=>widgetAvailable(w.key)).forEach(w=>{
    const lab = document.createElement('label');
    lab.innerHTML = '<span><span class="dot" style="background:'+w.color+'"></span>'+w.label+'</span>';
    const cb = document.createElement('input');
    cb.type='checkbox'; cb.checked = S.widgets[w.key];
    cb.addEventListener('change', ()=>{
      S.widgets[w.key] = cb.checked;
      try{ localStorage.setItem('w_'+w.key, cb.checked?'1':'0'); }catch(e){}
      S.dirty = true;
    });
    lab.appendChild(cb);
    body.appendChild(lab);
  });

  const layoutSep = document.createElement('hr'); layoutSep.className='p-sep'; body.appendChild(layoutSep);
  const layoutTitle = document.createElement('h4'); layoutTitle.textContent='仪表位置'; body.appendChild(layoutTitle);
  const layoutRow = document.createElement('div'); layoutRow.className='offset-row';
  const layoutBtn = document.createElement('button'); layoutBtn.className='off-btn';
  layoutBtn.textContent = '开始拖动';
  layoutBtn.addEventListener('click', ()=>{
    S.layoutEdit = !S.layoutEdit;
    stage.classList.toggle('layout-edit', S.layoutEdit);
    layoutBtn.textContent = S.layoutEdit ? '完成拖动' : '开始拖动';
    setStatus(S.layoutEdit ? '布局编辑：拖动仪表调整位置' : (S.statusBase || ''));
    S.dirty = true;
  });
  const resetLayoutBtn = document.createElement('button'); resetLayoutBtn.className='off-btn';
  resetLayoutBtn.textContent='恢复默认';
  resetLayoutBtn.addEventListener('click', ()=>{
    LAYOUT_KEYS.forEach(key=>{
      const d = LAYOUT_DEFAULTS[key];
      S.layout[key] = {x:d.x, y:d.y, w:d.w, h:d.h};
    });
    S.dirty = true;
  });
  layoutRow.appendChild(layoutBtn); layoutRow.appendChild(resetLayoutBtn); body.appendChild(layoutRow);
  const exportLayoutBtn = document.createElement('button'); exportLayoutBtn.className='off-btn';
  exportLayoutBtn.textContent='导出布局配置';
  exportLayoutBtn.addEventListener('click', ()=>{
    const config = {widgets:{}};
    LAYOUT_KEYS.forEach(key=>{ config.widgets[key] = {...S.layout[key]}; });
    const blob = new Blob([JSON.stringify(config, null, 2)+'\n'], {type:'application/json'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = 'layout-config.json'; link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href), 0);
  });
  body.appendChild(exportLayoutBtn);
  const layoutNote = document.createElement('div'); layoutNote.className='note';
  layoutNote.textContent='开启后直接拖动画布上的单个仪表；点击「导出布局配置」后，将下载的 layout-config.json 放回播放器目录即可保存。';
  body.appendChild(layoutNote);

  const note = document.createElement('div');
  note.className='note';
  note.innerHTML='配置在页面顶部 <code>CONFIG</code> 里：速度单位、曲线时长、颜色。<br>改完刷新即生效，视频原片零渲染。';
  body.appendChild(note);

  const removed = WIDGETS.filter(w=>!widgetAvailable(w.key));
  if(removed.length){
    const restoreSep = document.createElement('hr'); restoreSep.className='p-sep'; body.appendChild(restoreSep);
    const restoreTitle = document.createElement('h4'); restoreTitle.textContent='已删除仪表'; body.appendChild(restoreTitle);
    removed.forEach(w=>{
      const restoreBtn = document.createElement('button'); restoreBtn.className='off-btn';
      restoreBtn.textContent='恢复「'+w.label+'」';
      restoreBtn.addEventListener('click',()=>{
        S.removedWidgets.delete(w.key); saveRemovedWidgetPrefs(); buildPanel(); S.dirty=true;
      });
      body.appendChild(restoreBtn);
    });
  }
}
$('btnPanel').addEventListener('click', ()=>{ $('panel').classList.add('open'); $('scrim').classList.add('show'); });
$('btnPanelClose').addEventListener('click', closePanel);
$('scrim').addEventListener('click', closePanel);
function closePanel(){ $('panel').classList.remove('open'); $('scrim').classList.remove('show'); }

/* ---------------- 事件绑定 ---------------- */
$('btnData').addEventListener('click', ()=> $('fileData').click());
$('btnData2').addEventListener('click', ()=> $('fileData').click());
$('fileData').addEventListener('change', e=>{ if(e.target.files[0]) loadDataFromFile(e.target.files[0]); e.target.value=''; });
$('btnVideo').addEventListener('click', ()=> $('fileVideo').click());
$('btnVideo2').addEventListener('click', ()=> $('fileVideo').click());
$('fileVideo').addEventListener('change', e=>{ if(e.target.files[0]) loadVideoFile(e.target.files[0]); e.target.value=''; });
$('btnPlay').addEventListener('click', togglePlay);
$('seek').addEventListener('input', e=>{ const r=e.target; r.mousedown=true; });
$('seek').addEventListener('change', e=>{ seekTo(+e.target.value/10); e.target.mousedown=false; });
$('rate').addEventListener('change', e=>{ S.rate=+e.target.value; video.playbackRate=S.rate; });

/* ---------------- 仪表布局拖动 ---------------- */
function layoutCanvasPoint(e){
  const r = canvas.getBoundingClientRect();
  const s = Math.min(stage.clientWidth/LAYOUT_W, stage.clientHeight/LAYOUT_H);
  const ox = (stage.clientWidth - LAYOUT_W*s)/2;
  const oy = (stage.clientHeight - LAYOUT_H*s)/2;
  return {x:(e.clientX-r.left-ox)/s, y:(e.clientY-r.top-oy)/s};
}
function layoutVisible(key){
  return widgetAvailable(key) && S.widgets[key];
}
function layoutHitTest(point){
  // 后绘制的仪表优先响应，避免重叠时拖错目标。
  for(let i=LAYOUT_KEYS.length-1;i>=0;i--){
    const key = LAYOUT_KEYS[i];
    if(!layoutVisible(key)) continue;
    const p = S.layout[key];
    if(point.x>=p.x && point.x<=p.x+p.w && point.y>=p.y && point.y<=p.y+p.h) return key;
  }
  return null;
}
function clampLayoutPosition(key, x, y){
  const p = S.layout[key];
  p.x = Math.max(0, Math.min(LAYOUT_W-p.w, x));
  p.y = Math.max(0, Math.min(LAYOUT_H-p.h, y));
}
canvas.addEventListener('pointerdown', e=>{
  if(!S.layoutEdit) return;
  const point = layoutCanvasPoint(e), key = layoutHitTest(point);
  if(!key) return;
  const p = S.layout[key];
  S.draggingLayout = {key, dx:point.x-p.x, dy:point.y-p.y};
  canvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});
canvas.addEventListener('pointermove', e=>{
  if(!S.draggingLayout) return;
  const point = layoutCanvasPoint(e), d = S.draggingLayout;
  clampLayoutPosition(d.key, point.x-d.dx, point.y-d.dy);
  S.dirty = true;
  e.preventDefault();
});
function finishLayoutDrag(e){
  if(!S.draggingLayout) return;
  if(canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  S.draggingLayout = null;
  S.dirty = true;
}
canvas.addEventListener('pointerup', finishLayoutDrag);
canvas.addEventListener('pointercancel', finishLayoutDrag);
const widgetMenu = $('widgetMenu');
function closeWidgetMenu(){
  widgetMenu.classList.remove('open');
  S.contextWidget = null;
}
function openWidgetMenu(e, key){
  S.contextWidget = key;
  widgetMenu.classList.add('open');
  const pad = 8, menuW = 132, menuH = 42;
  widgetMenu.style.left = Math.min(e.clientX, window.innerWidth-menuW-pad) + 'px';
  widgetMenu.style.top = Math.min(e.clientY, window.innerHeight-menuH-pad) + 'px';
}
canvas.addEventListener('contextmenu', e=>{
  const key = layoutHitTest(layoutCanvasPoint(e));
  if(!key) return;
  e.preventDefault();
  openWidgetMenu(e, key);
});
$('deleteWidgetBtn').addEventListener('click', ()=>{
  if(!S.contextWidget) return;
  S.removedWidgets.add(S.contextWidget);
  saveRemovedWidgetPrefs();
  closeWidgetMenu();
  if(S.layoutEdit) S.layoutEdit=false;
  stage.classList.remove('layout-edit');
  buildPanel();
  S.dirty=true;
});
window.addEventListener('pointerdown', e=>{
  if(!widgetMenu.contains(e.target)) closeWidgetMenu();
});
canvas.addEventListener('pointerdown', e=>{
  if(S.layoutEdit || !S.data || !widgetAvailable('curve') || !S.widgets.curve) return;
  const point=layoutCanvasPoint(e), p=S.layout.curve;
  const plotX=p.x+18, plotY=p.y+28, plotW=p.w-36, plotH=p.h-40;
  if(point.x<plotX || point.x>plotX+plotW || point.y<plotY || point.y>plotY+plotH) return;

  const win=CONFIG.historyWindow;
  const nowT=playbackDataTime(currentT());
  const ts=S.series && S.series.t;
  const dataStart=S.dataStart||0, dataEnd=ts&&ts.length?ts[ts.length-1]:nowT;
  let tStart=Math.max(dataStart,nowT-win/2);
  let tEnd=Math.min(dataEnd,nowT+win/2);
  if(tEnd-tStart<win){
    if(tStart<=dataStart) tEnd=Math.min(dataEnd,dataStart+win);
    else if(tEnd>=dataEnd) tStart=Math.max(dataStart,dataEnd-win);
  }
  const dataT=tStart+(point.x-plotX)/plotW*(tEnd-tStart);
  seekTo(dataTimeToVideoTime(dataT));
  e.preventDefault();
});
canvas.addEventListener('pointerdown', e=>{
  if(S.layoutEdit || !S.data || !widgetAvailable('profile') || !S.widgets.profile || !S.profile) return;
  const point=layoutCanvasPoint(e), p=S.layout.profile;
  const plotX=p.x+16, plotY=p.y+28, plotW=p.w-32, plotH=p.h-38;
  if(point.x<plotX || point.x>plotX+plotW || point.y<plotY || point.y>plotY+plotH) return;
  const profile=S.profile;
  const dataT=profile.t0+(point.x-plotX)/plotW*(profile.t1-profile.t0);
  seekTo(dataTimeToVideoTime(dataT));
  e.preventDefault();
});

window.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  if(e.code==='ArrowLeft') seekTo(currentT()-5);
  if(e.code==='ArrowRight') seekTo(currentT()+5);
});

/* 拖拽：JSON = 数据，视频 = 视频 */
let dragDepth = 0;
window.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
window.addEventListener('dragenter', e=>{ e.preventDefault(); dragDepth++; });
window.addEventListener('dragleave', ()=>{ dragDepth=Math.max(0,dragDepth-1); });
window.addEventListener('drop', e=>{
  e.preventDefault(); dragDepth=0;
  const files = [...(e.dataTransfer.files||[])];
  for(const f of files){
    const n=f.name.toLowerCase();
    if(n.endsWith('.json')) loadDataFromFile(f);
    else if(/\.(mp4|mov|m4v|webm|mkv|avi)$/.test(n)) loadVideoFile(f);
    else setStatus('无法识别 ' + f.name + '（需要 .json 数据或视频文件）');
  }
});

/* URL 参数模式：?data=xxx.json&video=xxx.mp4&offset=49&offsetFile=xxx.offset.json */
(function(){
  const q = new URLSearchParams(location.search);
  const v = q.get('video'), d = q.get('data');
  if(v){ video.src = v; video.load(); empty.classList.add('dimmed'); S.hasVideo=true; video.addEventListener('loadedmetadata',()=>fitStage(video.videoWidth/video.videoHeight)); }
  if(d) loadDataFromUrl(d);
  const off = q.get('offset');
  if(off !== null){ S.offset = parseFloat(off) || 0; }
  const offFile = q.get('offsetFile');
  if(offFile){
    fetch(offFile).then(r=>r.json()).then(j=>{
      applyOffsetFile(j);
      if(S.offsetKey) try{ localStorage.setItem('off_'+S.offsetKey, S.offset); }catch(e){}
    }).catch(()=>{});
  }
})();

/* ---------------- 启动 ---------------- */
fitStage(16/9);
buildPanel();
requestAnimationFrame(tick);
</script>
